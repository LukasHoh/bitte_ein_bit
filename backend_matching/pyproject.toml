[project]
name = "backend-matching"
version = "0.1.0"
description = "ESCO skill-based occupation matching API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "fastapi",
    "pandas",
    "pydantic",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend_matching"
