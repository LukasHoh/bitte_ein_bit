[project]
name = "skill-backend"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.2.1",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.0.0",
    "langgraph-api>=0.8.1",
    "python-dotenv>=1.0.1",
    "supabase>=2.29.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
